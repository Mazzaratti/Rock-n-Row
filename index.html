<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mazzaratti — Rock & Row Card (SET #1)</title>

<style>
:root{
 --bg:#ffffff;
 --card:#f7f7f7;
 --text:#222;
 --accent:#d1382a;
 --border:#ccc;
 --cell:#fcfcfc;
 --check:#2a7a3b;
}

html,body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
}

.wrap{
 max-width:760px;
 margin:14px auto 22px;
 padding:0 14px;
 text-align:center;
}

.logo{
 width:100%;
 max-width:600px;
 margin:6px auto 8px;
}

.logo img{
 width:100%;
 height:auto;
 object-fit:contain;
}

h2{
 margin:6px 0 14px;
 font-size:clamp(24px,6vw,42px);
 font-weight:900;
 letter-spacing:.5px;
 line-height:1.05;
}

.card{
 background:#fff;
 border:1px solid var(--border);
 border-radius:10px;
 padding:14px;
 margin:0 auto 14px;
 box-shadow:0 6px 24px rgba(0,0,0,.06);
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
}

.cell{
 position:relative;
 background:var(--cell);
 border:1px solid var(--border);
 border-radius:8px;
 min-height:110px;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:10px;
 transition:transform .08s ease;
 user-select:none;
 -webkit-tap-highlight-color:transparent;
}

.cell:active{transform:scale(.99)}

.artist{
 font-weight:800;
 font-size:clamp(16px,3.7vw,22px);
 line-height:1.2;
 padding:0 4px;
}

/* checkmark */

.mark{
 position:absolute;
 inset:0;
 display:grid;
 place-items:center;
 border-radius:8px;
 pointer-events:none;
 opacity:0;
 transition:opacity .15s ease;
}

.mark::before{
 content:"✓";
 font-size:clamp(48px,10vw,72px);
 color:var(--check);
 text-shadow:0 2px 0 #fff;
 filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));
}

.cell.checked .mark{opacity:1}

.hint{
 margin-top:8px;
 color:#666;
 font-size:12px;
}
</style>
</head>

<body>

<div class="wrap">

<div class="logo">
<img alt="Mazzaratti logo" src="assets/Non-Bordered Logo.jpg">
</div>

<h2 id="title">ROCK-Artist-BINGO<br>SET #1-BLACKOUT</h2>

<div class="card">
<div id="grid" class="grid"></div>
</div>

<div class="hint">
Tap squares to mark ✓. (Long-press title for a new card.)
</div>

</div>

<script>

const SET_ID='set1'
const CARD_KEY=`rr_current_card_${SET_ID}_v1`

const ARTISTS=Array.from(new Set([

"Simple Minds","The B-52s","Missing Persons","Til Tuesday","Concrete Blonde","The Pretenders","Journey","Weezer","Billy Squier","Miranda Lambert","Led Zeppelin","Honeymoon Suite","Divinyls","The Cardigans","Better Than Ezra","Chappell Roan","Miley Cyrus","Gin Blossoms","Veruca Salt","No Doubt","Fastball","Ozzy Osbourne","Post Selfie w/Band"

]))

const gridEl=document.getElementById('grid')
const titleEl=document.getElementById('title')

let currentArtists=[]
let holdTimer=null


/* RANDOM CARD */

function pickNine(){

 const arr=ARTISTS.slice()

 for(let i=arr.length-1;i>0;i--){

  const j=Math.floor(Math.random()*(i+1))
  ;[arr[i],arr[j]]=[arr[j],arr[i]]

 }

 return arr.slice(0,9)

}


/* GRID */

function renderGrid(artists){

 gridEl.innerHTML=""

 artists.forEach((name,idx)=>{

  const cell=document.createElement('div')
  cell.className='cell'
  cell.dataset.idx=idx

  const span=document.createElement('div')
  span.className='artist'
  span.textContent=name

  const mark=document.createElement('div')
  mark.className='mark'

  cell.appendChild(span)
  cell.appendChild(mark)

  gridEl.appendChild(cell)

 })

 restoreChecks()

}


/* CLICK */

function toggleCell(el){

 el.classList.toggle('checked')
 persistChecks()

}

gridEl.addEventListener('click',(e)=>{

 const cell=e.target.closest('.cell')
 if(!cell)return

 toggleCell(cell)

})


/* STORAGE */

function storageKey(){

 const key=currentArtists.join('|')
 return `rr_checks_${SET_ID}_`+hashCode(key)

}

function persistChecks(){

 const checked=Array.from(gridEl.children).map(c=>c.classList.contains('checked')?1:0)

 localStorage.setItem(storageKey(),JSON.stringify(checked))

}

function restoreChecks(){

 try{

  const raw=localStorage.getItem(storageKey())
  if(!raw)return

  const arr=JSON.parse(raw)

  Array.from(gridEl.children).forEach((c,i)=>{

   if(arr[i])c.classList.add('checked')

  })

 }catch{}

}


/* HASH */

function hashCode(s){

 let h=0

 for(let i=0;i<s.length;i++){

  h=((h<<5)-h+s.charCodeAt(i))|0

 }

 return Math.abs(h)

}


/* CARD PERSISTENCE */

function saveCurrentCard(){

 try{

  localStorage.setItem(CARD_KEY,JSON.stringify(currentArtists))

 }catch{}

}

function loadSavedCard(){

 try{

  const raw=localStorage.getItem(CARD_KEY)
  if(!raw)return null

  const arr=JSON.parse(raw)

  if(!Array.isArray(arr)||arr.length!==9)return null
  if(new Set(arr).size!==9)return null

  for(const n of arr)

   if(typeof n!=='string'||!ARTISTS.includes(n))return null

  return arr

 }catch{

  return null

 }

}


/* NEW CARD */

function newCard(){

 currentArtists=pickNine()

 saveCurrentCard()

 renderGrid(currentArtists)

}


/* LONG PRESS */

titleEl.addEventListener('touchstart',startHold,{passive:true})
titleEl.addEventListener('mousedown',startHold)
titleEl.addEventListener('touchend',clearHold)
titleEl.addEventListener('mouseup',clearHold)
titleEl.addEventListener('mouseleave',clearHold)

function startHold(){

 clearHold()

 holdTimer=setTimeout(()=>{newCard()},1200)

}

function clearHold(){

 if(holdTimer){

  clearTimeout(holdTimer)
  holdTimer=null

 }

}


/* INIT */

const saved=loadSavedCard()

if(saved){

 currentArtists=saved
 renderGrid(currentArtists)

}else{

 newCard()

}

</script>

</body>
</html>
